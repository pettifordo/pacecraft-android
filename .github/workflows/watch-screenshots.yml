name: Wear OS emulator checks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :wear:assembleDebug
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/watch-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wear-OS-emulator-screenshots
          path: watch-screenshots/
      - name: Save verified watch screenshots
        run: |
          mkdir -p docs/screenshots/wear
          cp watch-screenshots/* docs/screenshots/wear/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/wear
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified Wear OS emulator screenshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
