name: Publish test APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build
        run: ./gradlew :engine:test :app:lintDebug :app:assembleDebug
      - name: Prepare test download
        run: |
          mkdir artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/pacecraft-0.1.0-test.apk
          cd artifacts
          sha256sum pacecraft-0.1.0-test.apk > pacecraft-0.1.0-test.apk.sha256
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0-test artifacts/* --target "$GITHUB_SHA" --title 'Pacecraft Android 0.1.0 — test APK' --prerelease --notes-file docs/RELEASE_NOTES.md
