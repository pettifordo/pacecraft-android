name: Publish test APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
      - name: Prepare test download
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "TEST_VERSION=$version" >> "$GITHUB_ENV"
          mkdir artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/CoachMeSimple-$version-test.apk"
          cp wear/build/outputs/apk/debug/wear-debug.apk "artifacts/CoachMeSimple-Wear-$version-test.apk"
          cd artifacts
          sha256sum *.apk > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$TEST_VERSION-test" artifacts/* --target "$GITHUB_SHA" --title "CoachMeSimple Android $TEST_VERSION — test APK" --prerelease --notes-file docs/RELEASE_NOTES.md
